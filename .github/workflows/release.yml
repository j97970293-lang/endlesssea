name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts
          test -f "docs/RELEASE-${VERSION}.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run unit tests and assemble debug APK
        run: >-
          ./gradlew
          :core:testDebugUnitTest
          :extensions-api:testDebugUnitTest
          :downloader:testDebugUnitTest
          :data:testDebugUnitTest
          :player:testDebugUnitTest
          :extensions-loader:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "endless-sea-${VERSION}-debug.apk"
          sha256sum "endless-sea-${VERSION}-debug.apk" > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/RELEASE-${VERSION}.md"
          TITLE="$(sed -n '1s/^# //p' "$NOTES")"
          test -n "$TITLE"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --verify-tag \
            "endless-sea-${VERSION}-debug.apk" \
            SHA256SUMS.txt
