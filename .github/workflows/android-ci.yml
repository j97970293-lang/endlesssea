name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # L'image ubuntu-latest des runners GitHub inclut déjà l'Android SDK
      # (ANDROID_HOME prédéfini, platform-35 + build-tools) : rien à installer.

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      # Unit tests of pure-Kotlin modules (engine math, parsers, API contract)
      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :extensions-api:testDebugUnitTest :downloader:testDebugUnitTest :data:testDebugUnitTest :player:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: endless-sea-debug-apk
          path: app/build/outputs/apk/debug/*.apk
